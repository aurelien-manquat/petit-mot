<!DOCTYPE html>
<html lang="fr">

<script data-goatcounter="https://aurelien.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Une petite question...</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body class="page-one">

    <main class="card">

        <p class="eyebrow">Une petite question...</p>

        <h1>
            Alors,<br>
            on fait connaissance ?
        </h1>

        <p class="description">
            Tu as réussi à arriver jusqu'ici.<br>
            Maintenant, c'est à toi de choisir. 👀
        </p>

        <div class="buttons">

            <button
    id="yesButton"
    class="btn btn-yes"
    data-goatcounter-click="oui">
    Pourquoi pas ? 👀
</button>

            <button
    id="noButton"
    class="btn btn-no"
    data-goatcounter-click="non">
    Non merci
</button>

        </div>

        <p id="message" class="message"></p>

    </main>

    <script src="script.js"></script>

</body>
</html>
